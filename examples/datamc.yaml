# Data vs stacked MC with a ratio pad.
#   python tests/fixtures/make_fixture_root.py examples/sample.root
#   hep-pad render examples/datamc.yaml -f pdf -f png
version: 1
inputs: {sample: sample.root}
layout: {rows: 2, height_ratios: [3, 1], hspace: 0.07}
pads:
  - id: main
    label: {text: Preliminary, lumi: 138, com: 13}
    xaxis: {range: [60, 120], ticklabels: false}
    yaxis: {label: Events / GeV, log: true}
    legend: {loc: upper right, reverse: true}
    layers:
      - id: bkg
        kind: stack
        members:
          - {ref: {file: sample, path: mc/vv/h_mass}, label: Diboson, color: '#e42536'}
          - {ref: {file: sample, path: mc/tt/h_mass}, label: '$t\bar{t}$', color: '#f89c20'}
          - {ref: {file: sample, path: mc/dy/h_mass}, label: Drell-Yan, color: '#5790fc'}
      - {id: unc, kind: errorband, of: bkg}
      - id: data
        kind: histogram
        ref: {file: sample, path: data/h_mass}
        histtype: errorbar
        label: Data
        color: black
  - id: ratio
    row: 1
    sharex: main
    xaxis: {label: '$m_{\mu\mu}$ [GeV]'}
    yaxis: {label: Data / MC, range: [0.8, 1.2]}
    layers:
      - {id: r, kind: ratio, num: data, den: bkg}
    annotations:
      - {kind: hline, at: 1.0}
